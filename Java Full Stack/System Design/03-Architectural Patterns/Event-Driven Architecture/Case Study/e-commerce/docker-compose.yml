# ============================================================
# Infrastructure for Event Driven Microservices
#
# Start:
#   docker compose up -d
#
# Stop:
#   docker compose down
#
# Verify:
#   docker ps
#
# Open Kafka UI and create following items
# http://localhost:8080
#   Create topic: order-created
#   Partitions: 3
#   Replication: 1
# ============================================================

services:

  # ==========================================================
  # Apache Kafka (KRaft Mode - No ZooKeeper)
  # ==========================================================
  kafka:

    image: apache/kafka:4.0.0

    container_name: kafka

    ports:
      # Internal Docker listener
      # Host machine listener
      - "29092:29092"

    environment:

      # Single broker
      KAFKA_NODE_ID: 1

      # Kafka 4.x KRaft mode
      KAFKA_PROCESS_ROLES: broker,controller

      # ------------------------------------------------------
      # Listeners
      #
      # PLAINTEXT      -> Docker containers
      # PLAINTEXT_HOST -> Applications running on host machine
      # CONTROLLER     -> KRaft controller
      # ------------------------------------------------------
      KAFKA_LISTENERS: >
        PLAINTEXT://:9092,
        PLAINTEXT_HOST://:29092,
        CONTROLLER://:9093

      # ------------------------------------------------------
      # Advertised listeners
      #
      # kafka:9092     -> Containers
      # localhost:29092 -> Local machine
      # ------------------------------------------------------
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092,
        PLAINTEXT_HOST://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ==========================================================
  # Kafka UI
  # ==========================================================
  kafka-ui:

    image: provectuslabs/kafka-ui:latest

    container_name: kafka-ui

    ports:
      - "8080:8080"

    environment:

      KAFKA_CLUSTERS_0_NAME: local

      # Kafka UI runs inside Docker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka